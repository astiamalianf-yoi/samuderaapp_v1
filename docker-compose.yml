# samudraapp.com stack. It shares the server with the samudraapp.id app (peringatan-* containers,
# /root/peringatan-cuaca), so every container, router and volume here has its own samudra-* name.
#
# The same file runs twice on the server:
#   production  /root/samudra-com      .env from .env.example          -> www / api.samudraapp.com
#   staging     /root/samudra-staging  .env from .env.staging.example  -> staging / api-staging.samudraapp.com
# Staging sets COMPOSE_PROJECT_NAME and CONTAINER_PREFIX, so its containers, routers, volumes,
# database and Redis are all separate from production. Unset, everything keeps the production names.
name: samudra-com

services:
  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-samudra}-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ${CONTAINER_PREFIX:-samudra}-mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  ml:
    build:
      context: ./SHAP-model-api
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-samudra}-ml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./disaster-backend
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-samudra}-backend
    restart: unless-stopped
    environment:
      PORT: "3000"
      REDIS_URL: redis://redis:6379
      ML_BASE_URL: http://ml:8000
      DATABASE_URL: sqlite:///app/data/disaster.db
      BASE_URL: ${BASE_URL:-https://${API_DOMAIN:-api.samudraapp.com}}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://${APP_DOMAIN:-www.samudraapp.com},https://${APP_APEX_DOMAIN:-samudraapp.com}}
      JWT_AUTH_ENABLED: ${JWT_AUTH_ENABLED:-false}
      JWT_SECRET: ${JWT_SECRET:-}
      # Keyed hash of fishermen's WhatsApp numbers: set a long random value and keep it private.
      FISHERMAN_HASH_SECRET: ${FISHERMAN_HASH_SECRET:-}
      # Researcher endpoints (/api/research/*) are off unless this is set.
      RESEARCH_API_KEY: ${RESEARCH_API_KEY:-}
      # Daily WhatsApp morning message, WIB "HH:MM" (empty = off). Manual: GET /api/broadcast/morning + X-Research-Key.
      MORNING_BROADCAST_TIME: ${MORNING_BROADCAST_TIME-05:30}
      # UAT only: BMKG test switch (POST /api/research/uat/bmkg, needs X-Research-Key). Keep false in the field study.
      BMKG_SIM_ENABLED: ${BMKG_SIM_ENABLED:-false}
      # Trust Index: adaptive (survey + app reports) or paper (Table 2 fixed); confirmation window in hours
      TRUST_INDEX_MODE: ${TRUST_INDEX_MODE:-adaptive}
      TRUST_CONFIRM_WINDOW_HOURS: ${TRUST_CONFIRM_WINDOW_HOURS:-24}
      # WhatsApp group (beach) warning class: majority of the beach's registered fishermen once at least
      # GROUP_MAJORITY_MIN have a profile (else the survey profile); "survey" keeps the survey profile always.
      # Reports of the same sign at a beach that raise a community warning (1 = one report is enough);
      # per beach: REPORT_THRESHOLD_BEACHES="pantai_lampuuk=3,pantai_lhoknga=5"
      REPORT_THRESHOLD: ${REPORT_THRESHOLD:-1}
      REPORT_THRESHOLD_BEACHES: ${REPORT_THRESHOLD_BEACHES:-}
      GROUP_CLASS_MODE: ${GROUP_CLASS_MODE:-majority}
      GROUP_MAJORITY_MIN: ${GROUP_MAJORITY_MIN:-10}
      # "Profil Anda" box on the Profil page (five tipping points, colours only). Shown by default;
      # set false to hide it (the fisherman then never sees his class).
      PROFILE_CLASS_VISIBLE: ${PROFILE_CLASS_VISIBLE:-true}
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-}
      OPENCLAW_HOOK_TOKEN: ${OPENCLAW_HOOK_TOKEN:-}
      OPENCLAW_BROADCAST_GROUPS: ${OPENCLAW_BROADCAST_GROUPS:-}
      # One group per beach: pantai_lhoknga=<id>@g.us,pantai_ulee_lheue=<id>@g.us (warnings only to the beach's own group)
      OPENCLAW_BEACH_GROUPS: ${OPENCLAW_BEACH_GROUPS:-}
      WEATHERAPI_KEY: ${WEATHERAPI_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      ENABLE_IOT_MQTT_DELIVERY: ${ENABLE_IOT_MQTT_DELIVERY:-true}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-mqtt://mosquitto:1883}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-alert}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_RETAIN: ${MQTT_RETAIN:-false}
      MQTT_ALARM_DURATION_MS: ${MQTT_ALARM_DURATION_MS:-15000}
      MQTT_PUBLISH_TIMEOUT_MS: ${MQTT_PUBLISH_TIMEOUT_MS:-2000}
    volumes:
      - backend_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
      ml:
        condition: service_healthy
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${CONTAINER_PREFIX:-samudra}-api.rule=Host(`${API_DOMAIN:-api.samudraapp.com}`)"
      - "traefik.http.routers.${CONTAINER_PREFIX:-samudra}-api.entrypoints=websecure"
      - "traefik.http.routers.${CONTAINER_PREFIX:-samudra}-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.${CONTAINER_PREFIX:-samudra}-api.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik-public"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: https://${API_DOMAIN:-api.samudraapp.com}
        # Staging only: a coloured bar on every page so testers never mistake it for the real app.
        VITE_STAGE_LABEL: ${STAGE_LABEL:-}
    container_name: ${CONTAINER_PREFIX:-samudra}-web
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${CONTAINER_PREFIX:-samudra}-web.rule=Host(`${APP_DOMAIN:-www.samudraapp.com}`) || Host(`${APP_APEX_DOMAIN:-samudraapp.com}`)"
      - "traefik.http.routers.${CONTAINER_PREFIX:-samudra}-web.entrypoints=websecure"
      - "traefik.http.routers.${CONTAINER_PREFIX:-samudra}-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.${CONTAINER_PREFIX:-samudra}-web.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik-public"

  openclaw-bridge:
    build:
      context: ./openclaw-bridge
      dockerfile: Dockerfile
    container_name: ${CONTAINER_PREFIX:-samudra}-openclaw-bridge
    restart: unless-stopped
    environment:
      # Our own OpenClaw (bot number of samudraapp.com), not the .id app's openclaw-openclaw-gateway-1.
      GATEWAY_WS_URL: ${OPENCLAW_GATEWAY_INTERNAL_URL:-ws://openclaw-gateway:18789}
      GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      REDIS_URL: redis://redis:6379
      BACKEND_WEBHOOK_URL: http://backend:3000/api/openclaw/webhook
      BACKEND_REPORT_URL: http://backend:3000/api/report
    depends_on:
      - backend
      - openclaw-gateway
    networks:
      - default

  # Our own OpenClaw (the samudraapp.com bot number), separate from the .id app's /root/openclaw.
  # Same image as the .id one (openclaw:local, already built on the server). No public ports:
  # only the bridge (and the backend through the hook) talk to it, inside this stack.
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    container_name: ${CONTAINER_PREFIX:-samudra}-openclaw-gateway
    restart: unless-stopped
    init: true
    environment: &openclaw-env
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_STATE_DIR: /home/node/.openclaw
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /home/node/.openclaw
      OPENCLAW_WORKSPACE_DIR: /home/node/.openclaw/workspace
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN in .env}
      TZ: Asia/Jakarta
    volumes: &openclaw-volumes
      - ${SAMUDRA_OPENCLAW_DIR:-/root/.openclaw-samudra}:/home/node/.openclaw
      - ${SAMUDRA_OPENCLAW_SECRETS_DIR:-/root/.openclaw-samudra-auth}:/home/node/.config/openclaw
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - default

  # Run only when needed, e.g. to link the bot number:
  #   docker compose run --rm openclaw-cli channels login --channel whatsapp
  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    profiles: ["cli"]
    network_mode: "service:openclaw-gateway"
    environment: *openclaw-env
    volumes: *openclaw-volumes
    cap_drop: [NET_RAW, NET_ADMIN]
    security_opt: ["no-new-privileges:true"]
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

volumes:
  redis_data:
  backend_data:

networks:
  traefik-public:
    external: true
